// ─── Speelschema publiek ─────────────────────────────────────

function PublicSchedule({ matches, teams, groups }) {
  const groupedByDate = useMemo(() => {
    const map = {};
    matches.forEach(m => {
      const date = m.scheduled_time ? new Date(m.scheduled_time).toDateString() : 'Onbekend';
      if (!map[date]) map[date] = [];
      map[date].push(m);
    });
    return Object.entries(map).sort(([a], [b]) => new Date(a) - new Date(b));
  }, [matches]);

  if (matches.length === 0) {
    return <div className="card empty-state">Speelschema is nog niet beschikbaar.</div>;
  }

  return (
    <div className="space-y-5">
      {groupedByDate.map(([date, dayMatches]) => (
        <div key={date} className="card">
          <h3 className="font-bold section-title mb-3">{formatDate(dayMatches[0]?.scheduled_time)}</h3>
          <div className="space-y-2">
            {dayMatches.map(m => {
              const home = teams.find(t => t.id === m.home_team_id);
              const away = teams.find(t => t.id === m.away_team_id);
              const group = groups.find(g => g.id === m.group_id);
              const isPlayed = m.status === 'played';

              return (
                <div key={m.id} className="match-row">
                  <div className="match-time">{formatTime(m.scheduled_time)}</div>
                  <div className="text-xs text-slate-500 w-14">Veld {m.field_number}</div>
                  <div className="flex-1 text-right font-medium">{home?.name || '—'}</div>
                  <div className="text-center w-20 font-bold">
                    {isPlayed ? (
                      <div>
                        <span className="text-slate-800 font-bold">{m.home_score} – {m.away_score}</span>
                        {m.home_score === m.away_score && m.home_penalties != null && (
                          <div className="text-xs text-yellow-600">({m.home_penalties}–{m.away_penalties} n.s.)</div>
                        )}
                      </div>
                    ) : (
                      <span className="text-slate-500">vs</span>
                    )}
                  </div>
                  <div className="flex-1 font-medium">{away?.name || '—'}</div>
                  <div className="text-xs text-slate-500 w-16 text-right">{group?.name}</div>
                </div>
              );
            })}
          </div>
        </div>
      ))}
    </div>
  );
}

// ─── Poulestanden publiek ─────────────────────────────────────

function PublicStandings({ groups, groupTeams, teams, matches }) {
  // Alleen poule-groepen tonen (groepen met teams), niet kruis finale groepen
  const poolGroups = useMemo(() =>
    groups.filter(g => groupTeams.some(gt => gt.group_id === g.id)),
    [groups, groupTeams]
  );

  const teamsByGroup = useMemo(() => {
    const map = {};
    poolGroups.forEach(g => {
      map[g.id] = groupTeams.filter(gt => gt.group_id === g.id).map(gt => teams.find(t => t.id === gt.team_id)).filter(Boolean);
    });
    return map;
  }, [poolGroups, groupTeams, teams]);

  const matchesByGroup = useMemo(() => {
    const map = {};
    poolGroups.forEach(g => { map[g.id] = matches.filter(m => m.group_id === g.id); });
    return map;
  }, [poolGroups, matches]);

  if (poolGroups.length === 0) {
    return <div className="card empty-state">Poules zijn nog niet beschikbaar.</div>;
  }

  return (
    <div className="space-y-5">
      {poolGroups.map(g => {
        const standings = calcStandings(teamsByGroup[g.id] || [], matchesByGroup[g.id] || []);
        return (
          <div key={g.id} className="card">
            <h3 className="font-bold section-title mb-3">{g.name}</h3>
            <table className="w-full text-sm">
              <thead>
                <tr className="table-header">
                  <th className="pb-2 w-6">#</th>
                  <th className="pb-2">Team</th>
                  <th className="pb-2 text-center">S</th>
                  <th className="pb-2 text-center">W</th>
                  <th className="pb-2 text-center">G</th>
                  <th className="pb-2 text-center">V</th>
                  <th className="pb-2 text-center">DV</th>
                  <th className="pb-2 text-center">DT</th>
                  <th className="pb-2 text-center">Pnt</th>
                </tr>
              </thead>
              <tbody>
                {standings.map((s, i) => (
                  <tr key={s.team.id} className={`table-row ${i === 0 && s.pts > 0 ? 'winner' : ''}`}>
                    <td className="py-2 text-slate-500">{i + 1}</td>
                    <td className="py-2 font-medium">{s.team.name}</td>
                    <td className="py-2 col-neutral">{s.p}</td>
                    <td className="py-2 col-win">{s.w}</td>
                    <td className="py-2 col-neutral">{s.d}</td>
                    <td className="py-2 col-loss">{s.l}</td>
                    <td className="py-2 text-center">{s.gf}</td>
                    <td className="py-2 text-center">{s.ga}</td>
                    <td className="py-2 col-pts">{s.pts}</td>
                  </tr>
                ))}
              </tbody>
            </table>
            <div className="text-xs text-slate-600 mt-2">S=Gespeeld, W=Gewonnen, G=Gelijk, V=Verloren, DV=Doelpunten voor, DT=Doelpunten tegen, Pnt=Punten</div>
          </div>
        );
      })}
    </div>
  );
}

// ─── Finales publiek ─────────────────────────────────────────

function PublicFinales({ groups, groupTeams, teams, matches }) {
  const sfGroup     = groups.find(g => g.name === 'Halve Finales');
  const finaleGroup = groups.find(g => g.name === 'Finale');
  const sfMatches   = sfGroup     ? [...matches.filter(m => m.group_id === sfGroup.id)].sort((a,b) => a.round_number - b.round_number)     : [];
  const finaleMatches = finaleGroup ? [...matches.filter(m => m.group_id === finaleGroup.id)].sort((a,b) => a.round_number - b.round_number) : [];

  const nPools = groups.filter(g => groupTeams.some(gt => gt.group_id === g.id)).length;

  function sfLabel(roundNumber) {
    if (roundNumber <= nPools) return `HF ${roundNumber}`;
    const idx      = roundNumber - nPools - 1;
    const posStart = 2 * nPools + 1 + idx * 2;
    return `${posStart}e/${posStart + 1}e Plek`;
  }

  if (!sfGroup && !finaleGroup) {
    return <div className="card empty-state">Kruis finales zijn nog niet beschikbaar.</div>;
  }

  function KnockoutRow({ match, label, labelColor }) {
    const home = teams.find(t => t.id === match.home_team_id);
    const away = teams.find(t => t.id === match.away_team_id);
    const isPlayed = match.status === 'played';
    const hasPenalties = isPlayed && match.home_score === match.away_score &&
                         match.home_penalties != null && match.away_penalties != null;
    const homeWinPen = hasPenalties && match.home_penalties > match.away_penalties;
    const awayWinPen = hasPenalties && match.away_penalties > match.home_penalties;
    const homeWin = isPlayed && (match.home_score > match.away_score || homeWinPen);
    const awayWin = isPlayed && (match.away_score > match.home_score || awayWinPen);
    return (
      <div className="match-row">
        <div className="match-time">{formatTime(match.scheduled_time)}</div>
        <div className="text-xs text-slate-500 w-14">Veld {match.field_number}</div>
        <div className={`flex-1 text-right font-medium ${homeWin ? 'win-text' : ''}`}>{home?.name || '—'}</div>
        <div className="text-center w-20 font-bold flex-shrink-0">
          {isPlayed ? (
            <div>
              <span className="text-slate-800 font-bold">{match.home_score} – {match.away_score}</span>
              {hasPenalties && (
                <div className="text-xs text-yellow-600">({match.home_penalties}–{match.away_penalties} n.s.)</div>
              )}
            </div>
          ) : <span className="text-slate-500">vs</span>}
        </div>
        <div className={`flex-1 font-medium ${awayWin ? 'win-text' : ''}`}>{away?.name || '—'}</div>
        <div className={`text-xs w-24 text-right font-medium ${labelColor || 'text-slate-500'}`}>{label}</div>
      </div>
    );
  }

  const actualSFs   = sfMatches.filter(m => m.round_number <= nPools);
  const consolation = sfMatches.filter(m => m.round_number > nPools);

  return (
    <div className="space-y-5">
      {actualSFs.length > 0 && (
        <div className="card">
          <h3 className="font-bold section-title mb-3">Halve Finales</h3>
          <div className="space-y-2">
            {actualSFs.map(m => <KnockoutRow key={m.id} match={m} label={sfLabel(m.round_number)} labelColor="text-blue-400" />)}
          </div>
        </div>
      )}
      {consolation.length > 0 && (
        <div className="card">
          <h3 className="font-bold section-title mb-3">Plaatsingswedstrijden</h3>
          <div className="space-y-2">
            {consolation.map(m => <KnockoutRow key={m.id} match={m} label={sfLabel(m.round_number)} labelColor="text-orange-400" />)}
          </div>
        </div>
      )}
      {finaleMatches.length > 0 && (
        <div className="card">
          <h3 className="font-bold section-title mb-3">Finale</h3>
          <div className="space-y-2">
            {finaleMatches.map((m, i) => (
              <KnockoutRow key={m.id} match={m}
                label={i === 0 ? '🥇 Finale' : '🥉 3e Plaats'}
                labelColor={i === 0 ? 'text-yellow-400' : 'text-slate-400'} />
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ─── Topscorer Klassement ─────────────────────────────────────

function TopScorers({ players }) {
  const scorers = [...players]
    .filter(p => (p.goals || 0) > 0)
    .sort((a, b) => (b.goals || 0) - (a.goals || 0))
    .slice(0, 10);

  if (scorers.length === 0) return null;

  return (
    <div className="card">
      <h3 className="text-xl font-bold section-title mb-3">⚽ Topscorer Klassement</h3>
      <table className="w-full">
        <thead>
          <tr className="table-header text-sm">
            <th className="pb-2 text-left w-7">#</th>
            <th className="pb-2 text-left">Speler</th>
            <th className="pb-2 text-center w-16">Goals</th>
          </tr>
        </thead>
        <tbody>
          {scorers.map((p, i) => (
            <tr key={p.id} className="table-row">
              <td className="py-2 text-slate-500 text-base">{i + 1}</td>
              <td className={`py-2 font-bold text-xl ${i === 0 ? 'text-yellow-600' : ''}`}>{p.name}</td>
              <td className={`py-2 text-center font-bold text-2xl col-pts ${i === 0 ? 'text-yellow-600' : ''}`}>{p.goals}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

// ─── Overzicht (TV-modus) ─────────────────────────────────────

function PublicOverview({ matches, teams, groups, groupTeams, players }) {
  const [now, setNow] = useState(new Date());
  useEffect(() => {
    const timer = setInterval(() => setNow(new Date()), 30000);
    return () => clearInterval(timer);
  }, []);

  const poolGroups = useMemo(() =>
    groups.filter(g => groupTeams.some(gt => gt.group_id === g.id)),
    [groups, groupTeams]
  );

  const teamsByGroup = useMemo(() => {
    const map = {};
    poolGroups.forEach(g => {
      map[g.id] = groupTeams.filter(gt => gt.group_id === g.id)
        .map(gt => teams.find(t => t.id === gt.team_id)).filter(Boolean);
    });
    return map;
  }, [poolGroups, groupTeams, teams]);

  const standingsPerGroup = useMemo(() =>
    poolGroups.map(g => ({
      group: g,
      standings: calcStandings(teamsByGroup[g.id] || [], matches.filter(m => m.group_id === g.id)),
    })),
    [poolGroups, teamsByGroup, matches]
  );

  const scheduleMatches = useMemo(() =>
    [...matches].sort((a, b) => new Date(a.scheduled_time) - new Date(b.scheduled_time)),
    [matches]
  );

  const sfGroup     = groups.find(g => g.name === 'Halve Finales');
  const finaleGroup = groups.find(g => g.name === 'Finale');
  const sfMatches   = sfGroup     ? scheduleMatches.filter(m => m.group_id === sfGroup.id)     : [];
  const finMatches  = finaleGroup ? scheduleMatches.filter(m => m.group_id === finaleGroup.id) : [];
  const poolMatches = scheduleMatches.filter(m => m.group_id !== sfGroup?.id && m.group_id !== finaleGroup?.id);

  // group pool matches by time slot (round)
  const matchesBySlot = useMemo(() => {
    const map = {};
    poolMatches.forEach(m => {
      const key = m.scheduled_time || 'unknown';
      if (!map[key]) map[key] = [];
      map[key].push(m);
    });
    return Object.entries(map).sort(([a], [b]) => new Date(a) - new Date(b));
  }, [poolMatches]);

  if (matches.length === 0 && groups.length === 0) {
    return (
      <div className="flex items-center justify-center h-64">
        <p className="text-slate-400 text-2xl">Toernooi is nog niet gestart.</p>
      </div>
    );
  }

  function MatchRow({ m, labelOverride }) {
    const home    = teams.find(t => t.id === m.home_team_id);
    const away    = teams.find(t => t.id === m.away_team_id);
    const group   = groups.find(g => g.id === m.group_id);
    const played  = m.status === 'played';
    const hasPenalties = played && m.home_score === m.away_score &&
                         m.home_penalties != null && m.away_penalties != null;
    const homeWinPen = hasPenalties && m.home_penalties > m.away_penalties;
    const awayWinPen = hasPenalties && m.away_penalties > m.home_penalties;
    const homeWin = played && (m.home_score > m.away_score || homeWinPen);
    const awayWin = played && (m.away_score > m.home_score || awayWinPen);

    return (
      <div className={`match-row py-3 ${played ? 'match-row-played' : ''}`}>
        <div className="text-base text-slate-400 w-16 flex-shrink-0 font-mono">{formatTime(m.scheduled_time)}</div>
        <div className="text-sm text-slate-500 w-16 flex-shrink-0">Veld {m.field_number}</div>
        <div className={`flex-1 text-right font-bold text-xl leading-tight ${homeWin ? 'win-text' : played ? 'text-slate-400' : 'text-slate-800'}`}>
          {home?.name || '—'}
        </div>
        <div className="w-24 text-center font-bold text-2xl flex-shrink-0">
          {played ? (
            <div>
              <span className="text-slate-800">{m.home_score} – {m.away_score}</span>
              {hasPenalties && (
                <div className="text-xs text-yellow-600 font-normal">({m.home_penalties}–{m.away_penalties} n.s.)</div>
              )}
            </div>
          ) : <span className="text-slate-400 text-base">vs</span>}
        </div>
        <div className={`flex-1 font-bold text-xl leading-tight ${awayWin ? 'win-text' : played ? 'text-slate-400' : 'text-slate-800'}`}>
          {away?.name || '—'}
        </div>
        <div className="text-sm text-slate-500 w-20 text-right flex-shrink-0">{labelOverride || group?.name}</div>
      </div>
    );
  }

  return (
    <div className="grid grid-cols-1 xl:grid-cols-5 gap-6">

      {/* LEFT — Poulestanden + Topscorers */}
      <div className="xl:col-span-2 space-y-5">
        <h2 className="text-2xl font-bold text-slate-800 tracking-wide">Poulestanden</h2>
        {standingsPerGroup.length === 0 ? (
          <p className="text-slate-400 text-lg">Nog geen poules.</p>
        ) : standingsPerGroup.map(({ group, standings }) => (
          <div key={group.id} className="card">
            <h3 className="text-xl font-bold section-title mb-3">{group.name}</h3>
            <table className="w-full">
              <thead>
                <tr className="table-header text-sm">
                  <th className="pb-2 text-left w-7">#</th>
                  <th className="pb-2 text-left">Team</th>
                  <th className="pb-2 text-center w-9">S</th>
                  <th className="pb-2 text-center w-9">W</th>
                  <th className="pb-2 text-center w-9">G</th>
                  <th className="pb-2 text-center w-9">V</th>
                  <th className="pb-2 text-center w-12">Pnt</th>
                </tr>
              </thead>
              <tbody>
                {standings.map((s, i) => (
                  <tr key={s.team.id} className={`table-row ${i < 2 && s.pts > 0 ? 'text-green-700' : ''}`}>
                    <td className="py-2 text-slate-500 text-base">{i + 1}</td>
                    <td className="py-2 font-bold text-xl">{s.team.name}</td>
                    <td className="py-2 text-center text-base">{s.p}</td>
                    <td className="py-2 text-center text-base">{s.w}</td>
                    <td className="py-2 text-center text-base">{s.d}</td>
                    <td className="py-2 text-center text-base">{s.l}</td>
                    <td className="py-2 text-center font-bold text-2xl col-pts">{s.pts}</td>
                  </tr>
                ))}
              </tbody>
            </table>
            <p className="text-xs text-slate-600 mt-2">Groen = door naar kruis finales</p>
          </div>
        ))}
        <TopScorers players={players} />
      </div>

      {/* RIGHT — Speelschema */}
      <div className="xl:col-span-3 space-y-5">
        <h2 className="text-2xl font-bold text-slate-800 tracking-wide">Speelschema &amp; Uitslagen</h2>

        {/* Pool matches per time slot */}
        {matchesBySlot.length === 0 && sfMatches.length === 0 && finMatches.length === 0 && (
          <p className="text-slate-400 text-lg">Nog geen wedstrijden gepland.</p>
        )}

        {matchesBySlot.map(([time, slotMatches]) => {
          const allPlayed = slotMatches.every(m => m.status === 'played');
          const slotTime = new Date(time);
          const isLive = !allPlayed && now >= slotTime;
          return (
            <div key={time} className={`card ${allPlayed ? 'opacity-60' : ''}`}>
              <div className="flex items-center gap-3 mb-3">
                <span className="text-lg font-bold text-slate-700 font-mono">{formatTime(time)}</span>
                {isLive && (
                  <span className="text-xs bg-green-900 text-green-300 px-2 py-0.5 rounded font-bold tracking-wider">LIVE</span>
                )}
                {allPlayed && (
                  <span className="text-xs bg-slate-200 text-slate-500 px-2 py-0.5 rounded">Gespeeld</span>
                )}
              </div>
              <div className="space-y-1">
                {slotMatches.map(m => <MatchRow key={m.id} m={m} />)}
              </div>
            </div>
          );
        })}

        {/* Halve finales */}
        {sfMatches.length > 0 && (
          <div className="card border border-blue-800">
            <h3 className="text-xl font-bold text-blue-400 mb-3">Halve Finales</h3>
            <div className="space-y-1">
              {sfMatches.map(m => <MatchRow key={m.id} m={m} labelOverride="HF" />)}
            </div>
          </div>
        )}

        {/* Finale */}
        {finMatches.length > 0 && (
          <div className="card border border-yellow-800">
            <h3 className="text-xl font-bold text-yellow-400 mb-3">Finale</h3>
            <div className="space-y-1">
              {finMatches.map((m, i) => <MatchRow key={m.id} m={m} labelOverride={i === 0 ? '🥇 Finale' : '🥉 3e Plek'} />)}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── Uitslagen publiek ────────────────────────────────────────

function PublicResults({ matches, teams, groups }) {
  const played = matches.filter(m => m.status === 'played');

  if (played.length === 0) {
    return <div className="card empty-state">Nog geen uitslagen beschikbaar.</div>;
  }

  const grouped = useMemo(() => {
    const map = {};
    groups.forEach(g => { map[g.id] = { group: g, matches: [] }; });
    played.forEach(m => { if (map[m.group_id]) map[m.group_id].matches.push(m); });
    return Object.values(map).filter(g => g.matches.length > 0);
  }, [played, groups]);

  return (
    <div className="space-y-5">
      {grouped.map(({ group, matches: gMatches }) => (
        <div key={group.id} className="card">
          <h3 className="font-bold section-title mb-3">{group.name}</h3>
          <div className="space-y-2">
            {gMatches.map(m => {
              const home = teams.find(t => t.id === m.home_team_id);
              const away = teams.find(t => t.id === m.away_team_id);
              const hasPenalties = m.home_score === m.away_score && m.home_penalties != null && m.away_penalties != null;
              const homeWin = m.home_score > m.away_score || (hasPenalties && m.home_penalties > m.away_penalties);
              const awayWin = m.away_score > m.home_score || (hasPenalties && m.away_penalties > m.home_penalties);
              return (
                <div key={m.id} className="match-row">
                  <div className="text-xs text-slate-500 w-28">{formatDateTime(m.scheduled_time)}</div>
                  <div className={`flex-1 text-right font-medium ${homeWin ? 'win-text' : ''}`}>{home?.name || '—'}</div>
                  <div className="w-20 text-center font-bold text-slate-800 text-lg">
                    <div>{m.home_score} – {m.away_score}</div>
                    {hasPenalties && <div className="text-xs text-yellow-600 font-normal">({m.home_penalties}–{m.away_penalties} n.s.)</div>}
                  </div>
                  <div className={`flex-1 font-medium ${awayWin ? 'win-text' : ''}`}>{away?.name || '—'}</div>
                </div>
              );
            })}
          </div>
        </div>
      ))}
    </div>
  );
}

function AdminLogin({ onLogin }) {
  const [pw, setPw] = useState('');
  const [error, setError] = useState('');

  function tryLogin(e) {
    e.preventDefault();
    if (pw === CONFIG.ADMIN_PASSWORD) { onLogin(); }
    else { setError('Onjuist wachtwoord.'); }
  }

  return (
    <div className="min-h-screen flex items-center justify-center">
      <div className="card w-full max-w-sm">
        <h2 className="text-xl font-bold text-slate-800 mb-1">⚙️ Admin</h2>
        <p className="text-slate-400 text-sm mb-5">Log in om het toernooi te beheren.</p>
        <form onSubmit={tryLogin} className="space-y-3">
          <input
            type="password" className="input" placeholder="Wachtwoord"
            value={pw} onChange={e => { setPw(e.target.value); setError(''); }}
            autoFocus
          />
          {error && <p className="text-red-400 text-sm">{error}</p>}
          <button className="btn-primary w-full" type="submit">Inloggen</button>
        </form>
      </div>
    </div>
  );
}

          {adminView === 'spelers'  && <AdminPlayers players={players} teams={teams} refresh={refresh} />}
          {adminView === 'teams'    && <AdminTeams players={players} teams={teams} refresh={refresh} />}
          {adminView === 'poules'   && <AdminGroups teams={teams} groups={groups} groupTeams={groupTeams} matches={matches} refresh={refresh} />}
          {adminView === 'schema'   && <AdminSchedule groups={groups} groupTeams={groupTeams} teams={teams} matches={matches} refresh={refresh} />}
          {adminView === 'finales'  && <AdminFinales groups={groups} groupTeams={groupTeams} teams={teams} matches={matches} refresh={refresh} />}
          {adminView === 'uitslagen' && <AdminResults matches={matches} teams={teams} groups={groups} refresh={refresh} />}
        </div>
      </div>
    );
  }

  // Publieke weergave
  const hasKnockout = groups.some(g => g.name === 'Halve Finales' || g.name === 'Finale');
  const publicTabs = [
    { id: 'overzicht', label: '📺 Overzicht' },
    { id: 'schema',   label: '📅 Speelschema' },
    { id: 'standen',  label: '🏆 Standen' },
    { id: 'uitslagen', label: '⚽ Uitslagen' },
    ...(hasKnockout ? [{ id: 'finales', label: '🏅 Finales' }] : []),
  ];

  return (
    <div className="min-h-screen">
      {/* Header */}
      <div className="border-b border-blue-900 px-4 py-4" style={{background:'#0a1628'}}>
        <div className="max-w-4xl mx-auto flex items-center justify-between">
          <div className="flex items-center gap-4">
            <img src="svod_logo.png" alt="SVOD'22" className="h-12 w-auto" />
            <div>
              <div className="font-bold text-white text-lg">{CONFIG.TOURNAMENT_NAME}</div>
              <div className="text-xs text-blue-300">{teams.length} teams · {matches.length} wedstrijden · {groups.length} poules</div>
            </div>
          </div>
          <button
            className="text-blue-700 hover:text-blue-400 text-xs"
            onClick={() => setShowAdminPanel(true)}
          >⚙</button>
        </div>
      </div>

      {/* Tabs */}
      <div className="border-b border-blue-900 px-4" style={{background:'#0d1b35'}}>
        <div className="max-w-4xl mx-auto flex">
          {publicTabs.map(tab => (
            <button
              key={tab.id}
              className={`px-5 py-3 text-sm font-medium transition-colors ${view === tab.id ? 'tab-active' : 'text-slate-400 hover:text-white'}`}
              onClick={() => setView(tab.id)}
            >
              {tab.label}
            </button>
          ))}
        </div>
      </div>

      {/* Content */}
      <div className={`mx-auto px-4 py-6 ${view === 'overzicht' ? 'max-w-7xl' : 'max-w-4xl'}`}>
        {view === 'overzicht'  && <PublicOverview matches={matches} teams={teams} groups={groups} groupTeams={groupTeams} players={players} />}
        {view === 'schema'    && <PublicSchedule matches={matches} teams={teams} groups={groups} />}
        {view === 'standen'   && <PublicStandings groups={groups} groupTeams={groupTeams} teams={teams} matches={matches} />}
        {view === 'uitslagen' && <PublicResults matches={matches} teams={teams} groups={groups} />}
        {view === 'finales'   && <PublicFinales groups={groups} groupTeams={groupTeams} teams={teams} matches={matches} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>

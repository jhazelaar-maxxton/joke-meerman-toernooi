const POSITIONS = ['GK', 'DEF', 'MID', 'FWD'];
const POS_LABELS = { GK: 'Keeper', DEF: 'Verdediger', MID: 'Middenvelder', FWD: 'Aanvaller' };

function formatDateTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('nl-NL', { weekday: 'short', day: 'numeric', month: 'short' })

// ─── Team generatie algoritme ─────────────────────────────────

function generateBalancedTeams(players, numTeams) {
  const teams = Array.from({ length: numTeams }, (_, i) => ({ index: i, players: [] }));

  // Groepeer per positie, gesorteerd op level desc
  const byPos = {};
  POSITIONS.forEach(p => {
    byPos[p] = players.filter(pl => pl.position === p).sort((a, b) => b.level - a.level);
  });

  // Verdeel per positie via snake draft
  POSITIONS.forEach(pos => {
    const posPlayers = byPos[pos];
    let idx = 0;
    let direction = 1;
    posPlayers.forEach(player => {
      teams[idx].players.push(player);
      idx += direction;
      if (idx >= numTeams) { idx = numTeams - 1; direction = -1; }
      else if (idx < 0) { idx = 0; direction = 1; }
    });
  });

  return teams;
}

// ─── Speelschema generatie (round-robin) ──────────────────────

function generateRoundRobin(teamIds) {
  const n = teamIds.length;
  const teams = n % 2 === 0 ? [...teamIds] : [...teamIds, null]; // bye indien oneven
  const rounds = [];
  const total = teams.length - 1;

  for (let round = 0; round < total; round++) {
    const matches = [];
    for (let i = 0; i < teams.length / 2; i++) {
      const home = teams[i];
      const away = teams[teams.length - 1 - i];
      if (home !== null && away !== null) {
        matches.push({ home, away });
      }
    }
    rounds.push(matches);
    // Roteer: houd teams[0] vast, roteer de rest
    teams.splice(1, 0, teams.pop());
  }
  return rounds;
}

// ─── Poulestanden berekenen ───────────────────────────────────

function calcStandings(teams, matches) {
  const stats = {};
  teams.forEach(t => {
    stats[t.id] = { team: t, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 };
  });

  matches.filter(m => m.status === 'played').forEach(m => {
    const h = stats[m.home_team_id];
    const a = stats[m.away_team_id];
    if (!h || !a) return;
    h.p++; a.p++;
    h.gf += m.home_score; h.ga += m.away_score;
    a.gf += m.away_score; a.ga += m.home_score;
    if (m.home_score > m.away_score) { h.w++; h.pts += 3; a.l++; }
    else if (m.home_score < m.away_score) { a.w++; a.pts += 3; h.l++; }
    else { h.d++; a.d++; h.pts++; a.pts++; }
  });

  return Object.values(stats).sort((a, b) =>
    b.pts - a.pts || (b.gf - b.ga) - (a.gf - a.ga) || b.gf - a.gf
  );
}

// ─── Data hooks ───────────────────────────────────────────────

function useData() {
  const [players, setPlayers] = useState([]);
  const [teams, setTeams] = useState([]);
  const [groups, setGroups] = useState([]);
  const [groupTeams, setGroupTeams] = useState([]);
  const [matches, setMatches] = useState([]);
  const [loading, setLoading] = useState(true);

  const refresh = useCallback(async () => {
    const [p, t, g, gt, m] = await Promise.all([
      sb.from('players').select('*').order('name'),
      sb.from('teams').select('*').order('name'),
      sb.from('groups').select('*').order('name'),
      sb.from('group_teams').select('*'),
      sb.from('matches').select('*').order('scheduled_time'),
    ]);
    if (p.data) setPlayers(p.data);
    if (t.data) setTeams(t.data);
    if (g.data) setGroups(g.data);
    if (gt.data) setGroupTeams(gt.data);
    if (m.data) setMatches(m.data);
    setLoading(false);
  }, []);

  useEffect(() => {
    refresh();
    // Realtime subscriptions
    const channel = sb.channel('tournament')
      .on('postgres_changes', { event: '*', schema: 'public' }, () => refresh())
      .subscribe();
    return () => sb.removeChannel(channel);
  }, [refresh]);

  return { players, teams, groups, groupTeams, matches, loading, refresh };
}

                  Gem. niveau: {team.players.length > 0 ? (team.players.reduce((s, p) => s + p.level, 0) / team.players.length).toFixed(1) : '—'}

                {team.players.map(p => (

                    <span>{p.name}</span>

// ─── Poule generatie ──────────────────────────────────────────

function AdminGroups({ teams, groups, groupTeams, matches, refresh }) {
  const [numGroups, setNumGroups] = useState(2);
  const [generating, setGenerating] = useState(false);

  const teamsByGroup = useMemo(() => {
    const map = {};
    groups.forEach(g => {
      map[g.id] = groupTeams.filter(gt => gt.group_id === g.id).map(gt => teams.find(t => t.id === gt.team_id)).filter(Boolean);
    });
    return map;
  }, [groups, groupTeams, teams]);

  async function generateGroups() {
    if (teams.length < 2) { alert('Voeg eerst teams toe.'); return; }
    if (!confirm('Poules en speelschema worden opnieuw gegenereerd. Doorgaan?')) return;
    setGenerating(true);

    // Wis bestaande poules en wedstrijden
    await sb.from('matches').delete().neq('id', '00000000-0000-0000-0000-000000000000');
    await sb.from('group_teams').delete().neq('id', '00000000-0000-0000-0000-000000000000');
    await sb.from('groups').delete().neq('id', '00000000-0000-0000-0000-000000000000');

    const n = parseInt(numGroups);
    const groupNames = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];

    // Shuffle teams
    const shuffled = [...teams].sort(() => Math.random() - 0.5);
    const groupsList = [];

    for (let i = 0; i < n; i++) {
      const { data } = await sb.from('groups').insert({ name: `Poule ${groupNames[i]}` }).select().single();
      if (data) groupsList.push(data);
    }

    // Verdeel teams over poules (round-robin verdeling)
    for (let i = 0; i < shuffled.length; i++) {
      const groupIdx = i % n;
      if (groupsList[groupIdx]) {
        await sb.from('group_teams').insert({ group_id: groupsList[groupIdx].id, team_id: shuffled[i].id });
      }
    }

    setGenerating(false);
    refresh();
  }

  return (
    <div className="space-y-5">
      <div className="card">
        <h2 className="text-lg font-bold mb-4 text-green-400">Poules genereren</h2>
        <p className="text-sm text-slate-400 mb-4">
          Teams worden random verdeeld over de poules. Je hebt <strong className="text-white">{teams.length} teams</strong>.
        </p>
        <div className="flex gap-3 items-end">
          <div>
            <label className="text-xs text-slate-400 mb-1 block">Aantal poules</label>
            <select className="select" value={numGroups} onChange={e => setNumGroups(e.target.value)}>
              {[2,3,4].map(n => <option key={n} value={n}>{n} poules</option>)}
            </select>
          </div>
          <button className="btn-primary" onClick={generateGroups} disabled={generating || teams.length < 2}>
            {generating ? <Spinner /> : '🎲 Genereer poules'}
          </button>
        </div>
      </div>

      {groups.length > 0 && (
        <div className="card">
          <h3 className="font-bold text-green-400 mb-3">Huidige poules</h3>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
            {groups.map(g => (
              <div key={g.id} className="bg-slate-900 rounded-lg p-3 border border-slate-700">
                <div className="font-bold text-white mb-2">{g.name}</div>
                {(teamsByGroup[g.id] || []).map(t => (
                  <div key={t.id} className="py-0.5 text-sm text-slate-300">🟢 {t.name}</div>
                ))}
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ─── Speelschema generatie ────────────────────────────────────

function AdminSchedule({ groups, groupTeams, teams, matches, refresh }) {
  const [startDate, setStartDate] = useState('');
  const [startTime, setStartTime] = useState('10:00');
  const [matchDuration, setMatchDuration] = useState(15);
  const [breakTime, setBreakTime] = useState(5);
  const [numFields, setNumFields] = useState(2);
  const [generating, setGenerating] = useState(false);

  const teamsByGroup = useMemo(() => {
    const map = {};
    groups.forEach(g => {
      map[g.id] = groupTeams.filter(gt => gt.group_id === g.id).map(gt => teams.find(t => t.id === gt.team_id)).filter(Boolean);
    });
    return map;
  }, [groups, groupTeams, teams]);

  async function generateSchedule() {
    if (!startDate) { alert('Selecteer een startdatum.'); return; }
    if (groups.length === 0) { alert('Genereer eerst poules.'); return; }
    if (!confirm('Het huidige speelschema wordt overschreven. Doorgaan?')) return;
    setGenerating(true);

    await sb.from('matches').delete().neq('id', '00000000-0000-0000-0000-000000000000');

    const slotMinutes = parseInt(matchDuration) + parseInt(breakTime);
    const fields = parseInt(numFields);
    let slotIndex = 0;

    for (const group of groups) {
      const groupTeamsList = teamsByGroup[group.id] || [];
      const teamIds = groupTeamsList.map(t => t.id);
      if (teamIds.length < 2) continue;

      const rounds = generateRoundRobin(teamIds);

      for (const [roundIdx, roundMatches] of rounds.entries()) {
        for (const [matchIdx, match] of roundMatches.entries()) {
          const currentSlot = slotIndex + Math.floor(matchIdx / fields);
          const field = (matchIdx % fields) + 1;
          const totalMinutes = currentSlot * slotMinutes;
          const [h, m] = startTime.split(':').map(Number);
          const dt = new Date(`${startDate}T${startTime.padStart(5,'0')}:00`);
          dt.setMinutes(dt.getMinutes() + totalMinutes);

          await sb.from('matches').insert({
            group_id: group.id,
            home_team_id: match.home,
            away_team_id: match.away,
            scheduled_time: dt.toISOString(),
            status: 'scheduled',
            round_number: roundIdx + 1,
            field_number: field,
          });
        }
        slotIndex += Math.ceil(roundMatches.length / fields);
      }
    }

    setGenerating(false);
    refresh();
  }

  return (
    <div className="space-y-5">
      <div className="card">
        <h2 className="text-lg font-bold mb-4 text-green-400">Speelschema genereren</h2>
        <div className="grid grid-cols-2 sm:grid-cols-3 gap-4 mb-4">
          <div>
            <label className="text-xs text-slate-400 mb-1 block">Datum</label>
            <input type="date" className="input" value={startDate} onChange={e => setStartDate(e.target.value)} />
          </div>
          <div>
            <label className="text-xs text-slate-400 mb-1 block">Starttijd</label>
            <input type="time" className="input" value={startTime} onChange={e => setStartTime(e.target.value)} />
          </div>
          <div>
            <label className="text-xs text-slate-400 mb-1 block">Wedstrijdduur (min)</label>
            <input type="number" className="input" value={matchDuration} min={5} max={90} onChange={e => setMatchDuration(e.target.value)} />
          </div>
          <div>
            <label className="text-xs text-slate-400 mb-1 block">Pauze tussen (min)</label>
            <input type="number" className="input" value={breakTime} min={0} max={30} onChange={e => setBreakTime(e.target.value)} />
          </div>
          <div>
            <label className="text-xs text-slate-400 mb-1 block">Aantal velden</label>
            <select className="select" value={numFields} onChange={e => setNumFields(e.target.value)}>
              {[1,2,3,4].map(n => <option key={n} value={n}>{n}</option>)}
            </select>
          </div>
        </div>
        <button className="btn-primary" onClick={generateSchedule} disabled={generating || groups.length === 0}>
          {generating ? <Spinner /> : '📅 Genereer speelschema'}
        </button>
      </div>

      {matches.length > 0 && (
        <div className="card">
          <h3 className="font-bold text-green-400 mb-3">Schema ({matches.length} wedstrijden)</h3>
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead>
                <tr className="text-slate-400 text-left border-b border-slate-700">
                  <th className="pb-2">Tijd</th>
                  <th className="pb-2">Veld</th>
                  <th className="pb-2">Thuis</th>
                  <th className="pb-2">Uit</th>
                  <th className="pb-2">Poule</th>
                </tr>
              </thead>
              <tbody>
                {matches.map(m => {
                  const home = teams.find(t => t.id === m.home_team_id);
                  const away = teams.find(t => t.id === m.away_team_id);
                  const group = groups.find(g => g.id === m.group_id);
                  return (
                    <tr key={m.id} className="border-b border-slate-800">
                      <td className="py-2 text-slate-300">{formatDateTime(m.scheduled_time)}</td>
                      <td className="py-2 text-slate-400">Veld {m.field_number}</td>
                      <td className="py-2 font-medium">{home?.name || '—'}</td>
                      <td className="py-2 font-medium">{away?.name || '—'}</td>
                      <td className="py-2 text-slate-400">{group?.name || '—'}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── Uitslagen invoeren ───────────────────────────────────────

function AdminResults({ matches, teams, groups, refresh }) {
  const [scores, setScores] = useState({});
  const [saving, setSaving] = useState(null);

  const groupedMatches = useMemo(() => {
    const grouped = {};
    groups.forEach(g => { grouped[g.id] = { group: g, matches: [] }; });
    matches.forEach(m => {
      if (grouped[m.group_id]) grouped[m.group_id].matches.push(m);
    });
    return Object.values(grouped);
  }, [matches, groups]);

  async function saveScore(matchId) {
    const s = scores[matchId];
    if (!s || s.home === '' || s.away === '') { alert('Vul beide scores in.'); return; }
    setSaving(matchId);
    await sb.from('matches').update({
      home_score: parseInt(s.home),
      away_score: parseInt(s.away),
      status: 'played',
    }).eq('id', matchId);
    setSaving(null);
    refresh();
  }

  async function clearScore(matchId) {
    await sb.from('matches').update({ home_score: null, away_score: null, status: 'scheduled' }).eq('id', matchId);
    refresh();
  }

  return (
    <div className="space-y-5">
      {groupedMatches.map(({ group, matches: gMatches }) => (
        <div key={group.id} className="card">
          <h2 className="text-lg font-bold mb-4 text-green-400">{group.name}</h2>
          <div className="space-y-2">
            {gMatches.map(m => {
              const home = teams.find(t => t.id === m.home_team_id);
              const away = teams.find(t => t.id === m.away_team_id);
              const sc = scores[m.id] || { home: m.home_score ?? '', away: m.away_score ?? '' };
              const isPlayed = m.status === 'played';

              return (
                <div key={m.id} className={`flex items-center gap-3 p-3 rounded-lg border ${isPlayed ? 'border-green-800 bg-green-950/30' : 'border-slate-700 bg-slate-900'}`}>
                  <div className="text-xs text-slate-500 w-28 flex-shrink-0">{formatDateTime(m.scheduled_time)}</div>
                  <div className="flex-1 font-medium text-right">{home?.name || '—'}</div>
                  <div className="flex items-center gap-1">
                    <input
                      type="number" min="0" max="99"
                      className="input w-12 text-center"
                      value={sc.home}
                      onChange={e => setScores(prev => ({ ...prev, [m.id]: { ...sc, home: e.target.value } }))}
                    />
                    <span className="text-slate-500">–</span>
                    <input
                      type="number" min="0" max="99"
                      className="input w-12 text-center"
                      value={sc.away}
                      onChange={e => setScores(prev => ({ ...prev, [m.id]: { ...sc, away: e.target.value } }))}
                    />
                  </div>
                  <div className="flex-1 font-medium">{away?.name || '—'}</div>
                  <div className="flex gap-1">
                    <button
                      className="btn-primary text-xs py-1 px-2"
                      onClick={() => saveScore(m.id)}
                      disabled={saving === m.id}
                    >
                      {saving === m.id ? <Spinner /> : '✓'}
                    </button>
                    {isPlayed && (
                      <button className="btn-secondary text-xs py-1 px-2" onClick={() => clearScore(m.id)}>↩</button>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      ))}
      {groupedMatches.length === 0 && (
        <div className="card text-slate-400 text-sm">Nog geen wedstrijden. Genereer eerst het speelschema.</div>
      )}
    </div>
  );
}

// ================================================================
// PUBLIEKE VIEWS
// ================================================================

// ─── Speelschema publiek ─────────────────────────────────────

function PublicSchedule({ matches, teams, groups }) {
  const groupedByDate = useMemo(() => {
    const map = {};
    matches.forEach(m => {
      const date = m.scheduled_time ? new Date(m.scheduled_time).toDateString() : 'Onbekend';
      if (!map[date]) map[date] = [];
      map[date].push(m);
    });
    return Object.entries(map).sort(([a], [b]) => new Date(a) - new Date(b));
  }, [matches]);

  if (matches.length === 0) {
    return <div className="card text-slate-400 text-sm">Speelschema is nog niet beschikbaar.</div>;
  }

  return (
    <div className="space-y-5">
      {groupedByDate.map(([date, dayMatches]) => (
        <div key={date} className="card">
          <h3 className="font-bold text-green-400 mb-3">{formatDate(dayMatches[0]?.scheduled_time)}</h3>
          <div className="space-y-2">
            {dayMatches.map(m => {
              const home = teams.find(t => t.id === m.home_team_id);
              const away = teams.find(t => t.id === m.away_team_id);
              const group = groups.find(g => g.id === m.group_id);
              const isPlayed = m.status === 'played';

              return (
                <div key={m.id} className={`flex items-center gap-3 p-3 rounded-lg ${isPlayed ? 'bg-slate-900 border border-slate-700' : 'bg-slate-900 border border-slate-800'}`}>
                  <div className="text-sm font-mono text-green-400 w-12">{formatTime(m.scheduled_time)}</div>
                  <div className="text-xs text-slate-500 w-14">Veld {m.field_number}</div>
                  <div className="flex-1 text-right font-medium">{home?.name || '—'}</div>
                  <div className="text-center w-20 font-bold">
                    {isPlayed ? (
                      <span className="text-white">{m.home_score} – {m.away_score}</span>
                    ) : (
                      <span className="text-slate-500">vs</span>
                    )}
                  </div>
                  <div className="flex-1 font-medium">{away?.name || '—'}</div>
                  <div className="text-xs text-slate-500 w-16 text-right">{group?.name}</div>
                </div>
              );
            })}
          </div>
        </div>
      ))}
    </div>
  );
}

// ─── Poulestanden publiek ─────────────────────────────────────

function PublicStandings({ groups, groupTeams, teams, matches }) {
  const teamsByGroup = useMemo(() => {
    const map = {};
    groups.forEach(g => {
      map[g.id] = groupTeams.filter(gt => gt.group_id === g.id).map(gt => teams.find(t => t.id === gt.team_id)).filter(Boolean);
    });
    return map;
  }, [groups, groupTeams, teams]);

  const matchesByGroup = useMemo(() => {
    const map = {};
    groups.forEach(g => { map[g.id] = matches.filter(m => m.group_id === g.id); });
    return map;
  }, [groups, matches]);

  if (groups.length === 0) {
    return <div className="card text-slate-400 text-sm">Poules zijn nog niet beschikbaar.</div>;
  }

  return (
    <div className="space-y-5">
      {groups.map(g => {
        const standings = calcStandings(teamsByGroup[g.id] || [], matchesByGroup[g.id] || []);
        return (
          <div key={g.id} className="card">
            <h3 className="font-bold text-green-400 mb-3">{g.name}</h3>
            <table className="w-full text-sm">
              <thead>
                <tr className="text-slate-400 text-left border-b border-slate-700">
                  <th className="pb-2 w-6">#</th>
                  <th className="pb-2">Team</th>
                  <th className="pb-2 text-center">S</th>
                  <th className="pb-2 text-center">W</th>
                  <th className="pb-2 text-center">G</th>
                  <th className="pb-2 text-center">V</th>
                  <th className="pb-2 text-center">DV</th>
                  <th className="pb-2 text-center">DT</th>
                  <th className="pb-2 text-center">Pnt</th>
                </tr>
              </thead>
              <tbody>
                {standings.map((s, i) => (
                  <tr key={s.team.id} className={`border-b border-slate-800 ${i === 0 && s.pts > 0 ? 'winner' : ''}`}>
                    <td className="py-2 text-slate-500">{i + 1}</td>
                    <td className="py-2 font-medium">{s.team.name}</td>
                    <td className="py-2 text-center text-slate-400">{s.p}</td>
                    <td className="py-2 text-center text-green-400">{s.w}</td>
                    <td className="py-2 text-center text-slate-400">{s.d}</td>
                    <td className="py-2 text-center text-red-400">{s.l}</td>
                    <td className="py-2 text-center">{s.gf}</td>
                    <td className="py-2 text-center">{s.ga}</td>
                    <td className="py-2 text-center font-bold text-white">{s.pts}</td>
                  </tr>
                ))}
              </tbody>
            </table>
            <div className="text-xs text-slate-600 mt-2">S=Gespeeld, W=Gewonnen, G=Gelijk, V=Verloren, DV=Doelpunten voor, DT=Doelpunten tegen, Pnt=Punten</div>
          </div>
        );
      })}
    </div>
  );
}

// ─── Uitslagen publiek ────────────────────────────────────────

function PublicResults({ matches, teams, groups }) {
  const played = matches.filter(m => m.status === 'played');

  if (played.length === 0) {
    return <div className="card text-slate-400 text-sm">Nog geen uitslagen beschikbaar.</div>;
  }

  const grouped = useMemo(() => {
    const map = {};
    groups.forEach(g => { map[g.id] = { group: g, matches: [] }; });
    played.forEach(m => { if (map[m.group_id]) map[m.group_id].matches.push(m); });
    return Object.values(map).filter(g => g.matches.length > 0);
  }, [played, groups]);

  return (
    <div className="space-y-5">
      {grouped.map(({ group, matches: gMatches }) => (
        <div key={group.id} className="card">
          <h3 className="font-bold text-green-400 mb-3">{group.name}</h3>
          <div className="space-y-2">
            {gMatches.map(m => {
              const home = teams.find(t => t.id === m.home_team_id);
              const away = teams.find(t => t.id === m.away_team_id);
              const homeWin = m.home_score > m.away_score;
              const awayWin = m.away_score > m.home_score;
              return (
                <div key={m.id} className="flex items-center gap-3 p-3 rounded-lg bg-slate-900 border border-slate-700">
                  <div className="text-xs text-slate-500 w-28">{formatDateTime(m.scheduled_time)}</div>
                  <div className={`flex-1 text-right font-medium ${homeWin ? 'text-green-400' : ''}`}>{home?.name || '—'}</div>
                  <div className="w-20 text-center font-bold text-white text-lg">
                    {m.home_score} – {m.away_score}
                  </div>
                  <div className={`flex-1 font-medium ${awayWin ? 'text-green-400' : ''}`}>{away?.name || '—'}</div>
                </div>
              );
            })}
          </div>
        </div>
      ))}
    </div>
  );
}

// ================================================================
// ADMIN LOGIN
// ================================================================

function AdminLogin({ onLogin }) {
  const [pw, setPw] = useState('');
  const [error, setError] = useState('');

  function tryLogin(e) {
    e.preventDefault();
    if (pw === CONFIG.ADMIN_PASSWORD) { onLogin(); }
    else { setError('Onjuist wachtwoord.'); }
  }

  return (
    <div className="min-h-screen flex items-center justify-center">
      <div className="card w-full max-w-sm">
        <h2 className="text-xl font-bold text-white mb-1">⚙️ Admin</h2>
        <p className="text-slate-400 text-sm mb-5">Log in om het toernooi te beheren.</p>
        <form onSubmit={tryLogin} className="space-y-3">
          <input
            type="password" className="input" placeholder="Wachtwoord"
            value={pw} onChange={e => { setPw(e.target.value); setError(''); }}
            autoFocus
          />
          {error && <p className="text-red-400 text-sm">{error}</p>}
          <button className="btn-primary w-full" type="submit">Inloggen</button>
        </form>
      </div>
    </div>
  );
}

// ================================================================
// HOOFD APP
// ================================================================

function App() {
  const { players, teams, groups, groupTeams, matches, loading, refresh } = useData();
  const [view, setView] = useState('schema'); // schema | standen | uitslagen
  const [adminView, setAdminView] = useState('spelers'); // spelers | teams | poules | schema | uitslagen
  const [isAdmin, setIsAdmin] = useState(false);
  const [showAdminPanel, setShowAdminPanel] = useState(false);

  if (loading) {
    return (
      <div className="min-h-screen flex flex-col items-center justify-center gap-4">
        <Spinner />
        <p className="text-slate-400">Toernooi laden…</p>
      </div>
    );
  }

  // Check Supabase config
  if (CONFIG.SUPABASE_URL === 'JOUW_SUPABASE_URL') {
    return (
      <div className="min-h-screen flex items-center justify-center p-4">
        <div className="card max-w-md">
          <h2 className="text-xl font-bold text-yellow-400 mb-3">⚠️ Configuratie vereist</h2>
          <p className="text-slate-300 text-sm mb-3">
            Open <code className="bg-slate-900 px-1 rounded">index.html</code> in een teksteditor en vul bovenaan je Supabase URL, anon key en admin wachtwoord in bij <code className="bg-slate-900 px-1 rounded">CONFIG</code>.
          </p>
          <p className="text-slate-400 text-xs">Zie de setupinstructies voor meer uitleg.</p>
        </div>
      </div>
    );
  }

  if (showAdminPanel && !isAdmin) {
    return <AdminLogin onLogin={() => setIsAdmin(true)} />;
  }

  if (showAdminPanel && isAdmin) {
    const adminTabs = [
      { id: 'spelers', label: '👤 Spelers' },
      { id: 'teams', label: '👕 Teams' },
      { id: 'poules', label: '🏆 Poules' },
      { id: 'schema', label: '📅 Schema' },
      { id: 'uitslagen', label: '⚽ Uitslagen' },
    ];

    return (
      <div className="min-h-screen">
        {/* Header */}
        <div className="bg-slate-900 border-b border-slate-700 px-4 py-3 flex items-center justify-between">
          <div className="flex items-center gap-3">
            <span className="text-2xl">⚽</span>
            <span className="font-bold text-white">{CONFIG.TOURNAMENT_NAME}</span>
            <span className="text-xs bg-green-900 text-green-300 px-2 py-0.5 rounded">Admin</span>
          </div>
          <button className="btn-secondary text-sm" onClick={() => setShowAdminPanel(false)}>← Publiek</button>
        </div>

        {/* Tabs */}
        <div className="bg-slate-900 border-b border-slate-700 px-4 overflow-x-auto">
          <div className="flex gap-1 min-w-max">
            {adminTabs.map(tab => (
              <button
                key={tab.id}
                className={`px-4 py-3 text-sm font-medium transition-colors ${adminView === tab.id ? 'tab-active' : 'text-slate-400 hover:text-white'}`}
                onClick={() => setAdminView(tab.id)}
              >
                {tab.label}
              </button>
            ))}
          </div>
        </div>

        {/* Content */}
        <div className="max-w-4xl mx-auto px-4 py-6">
          {adminView === 'spelers' && <AdminPlayers players={players} teams={teams} refresh={refresh} />}
          {adminView === 'teams' && <AdminTeams players={players} teams={teams} refresh={refresh} />}
          {adminView === 'poules' && <AdminGroups teams={teams} groups={groups} groupTeams={groupTeams} matches={matches} refresh={refresh} />}
          {adminView === 'schema' && <AdminSchedule groups={groups} groupTeams={groupTeams} teams={teams} matches={matches} refresh={refresh} />}
          {adminView === 'uitslagen' && <AdminResults matches={matches} teams={teams} groups={groups} refresh={refresh} />}
        </div>
      </div>
    );
  }

  // Publieke weergave
  const publicTabs = [
    { id: 'schema', label: '📅 Speelschema' },
    { id: 'standen', label: '🏆 Standen' },
    { id: 'uitslagen', label: '⚽ Uitslagen' },
  ];

  return (
    <div className="min-h-screen">
      {/* Header */}
      <div className="bg-slate-900 border-b border-slate-700 px-4 py-4">
        <div className="max-w-4xl mx-auto flex items-center justify-between">
          <div className="flex items-center gap-3">
            <span className="text-3xl">⚽</span>
            <div>
              <div className="font-bold text-white text-lg">{CONFIG.TOURNAMENT_NAME}</div>
              <div className="text-xs text-slate-400">{teams.length} teams · {matches.length} wedstrijden · {groups.length} poules</div>
            </div>
          </div>
          <button
            className="text-slate-600 hover:text-slate-400 text-xs"
            onClick={() => setShowAdminPanel(true)}
          >⚙</button>
        </div>
      </div>

      {/* Tabs */}
      <div className="bg-slate-900 border-b border-slate-700 px-4">
        <div className="max-w-4xl mx-auto flex">
          {publicTabs.map(tab => (
            <button
              key={tab.id}
              className={`px-5 py-3 text-sm font-medium transition-colors ${view === tab.id ? 'tab-active' : 'text-slate-400 hover:text-white'}`}
              onClick={() => setView(tab.id)}
            >
              {tab.label}
            </button>
          ))}
        </div>
      </div>

      {/* Content */}
      <div className="max-w-4xl mx-auto px-4 py-6">
        {view === 'schema' && <PublicSchedule matches={matches} teams={teams} groups={groups} />}
        {view === 'standen' && <PublicStandings groups={groups} groupTeams={groupTeams} teams={teams} matches={matches} />}
        {view === 'uitslagen' && <PublicResults matches={matches} teams={teams} groups={groups} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
